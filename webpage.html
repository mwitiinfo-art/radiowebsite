<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jesus is LORD Radio - Listen Live</title>
<meta name="description" content="Listen live to Jesus is LORD Radio.">
<meta name="theme-color" content="#122b52">
<meta property="og:type" content="website">
<meta property="og:title" content="Jesus is LORD Radio">
<meta property="og:description" content="Tap to listen live.">
<link rel="preconnect" href="https://stream.zeno.fm">
<link rel="preconnect" href="https://s3.radio.co">
<style>
/* ===== Change the look here ===== */
:root{
  --bg-top:#1b3a6b;          /* page background, top colour */
  --bg-bottom:#0a1a33;       /* page background, bottom colour */
  --bg-image:none;           /* or: url('bg.jpg')  (upload bg.jpg next to this file) */
  --card:rgba(18,43,82,.88); /* the panel in the middle */
  --text:#ffffff;
  --muted:#cbd5e1;
  --accent:#e53935;          /* play/pause icon */
  --live:#00e676;            /* LIVE light and bars */
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg-image),linear-gradient(160deg,var(--bg-top),var(--bg-bottom));
  background-size:cover;background-position:center;background-attachment:fixed}
.card{width:100%;max-width:420px;padding:40px 26px 28px;text-align:center;background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:16px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,8vw,38px);line-height:1.15}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#8492a6}
.is-live .dot{background:var(--live)}
.is-live .status{color:var(--text)}
.is-busy .dot{background:#e6b422}
.play{margin:0 auto;width:124px;height:124px;border-radius:50%;border:6px solid rgba(255,255,255,.3);background:#fff;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.play:hover{transform:scale(1.04)}.play:active{transform:scale(.96)}
.play:focus-visible{outline:3px solid var(--live);outline-offset:4px}
.play svg{width:52px;height:52px;fill:var(--accent)}
.main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:30px 0 22px}
.recwrap{display:flex;flex-direction:column;align-items:center;gap:6px;justify-self:center;font-size:11px;color:var(--muted)}
.rec{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rec i{width:18px;height:18px;border-radius:50%;background:#ff5252}
.rec:hover{background:rgba(255,255,255,.1)}
.rec:focus-visible{outline:3px solid var(--live);outline-offset:3px}
.rec.on{border-color:#ff5252;background:rgba(255,82,82,.18)}
.rec.on i{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.saved{display:none;margin-top:22px;padding:10px 12px;border:1px solid rgba(255,255,255,.2);border-radius:12px;font-size:13px;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.saved.show{display:flex}
.saved a,.saved button{background:#3b6fd4;color:#fff;border:0;border-radius:999px;padding:7px 14px;font:600 12px inherit;cursor:pointer;text-decoration:none}
.saved .ghost{background:transparent;border:1px solid rgba(255,255,255,.3)}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:38px;margin-top:0}
.bars i{width:6px;height:100%;border-radius:2px;background:var(--live);transform-origin:bottom;transform:scaleY(.14)}
.is-live .bars i{animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.7s!important;animation-duration:.8s!important}
.bars i:nth-child(3){animation-delay:-.3s!important;animation-duration:1.1s!important}
.bars i:nth-child(4){animation-delay:-.9s!important;animation-duration:.9s!important}
.bars i:nth-child(5){animation-delay:-.5s!important;animation-duration:1.2s!important}
.bars i:nth-child(6){animation-delay:-.2s!important;animation-duration:.85s!important}
.bars i:nth-child(7){animation-delay:-.6s!important;animation-duration:1s!important}
@keyframes eq{0%,100%{transform:scaleY(.18)}50%{transform:scaleY(1)}}
.vol{display:flex;align-items:center;gap:12px;margin:26px 4px 0}
.vol svg{flex:none;width:20px;height:20px;fill:var(--muted)}
.vol input{flex:1;accent-color:var(--accent);cursor:pointer;height:20px;margin:0}
.share{margin-top:24px;background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 22px;font:600 14px inherit;cursor:pointer}
.share:hover{background:rgba(255,255,255,.1)}
.note{margin:18px 0 0;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.is-live .bars i{animation:none;transform:scaleY(.6)}}
</style>
</head>
<body>
<main class="card" id="card">
  <h1>Jesus is LORD Radio</h1>
  <div class="status"><span class="dot"></span><span id="label">TAP PLAY TO LISTEN</span></div>

  <div class="main">
    <span></span>
    <button class="play" id="play" type="button" aria-label="Play Jesus is LORD Radio" aria-pressed="false">
      <svg id="ico-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg id="ico-pause" viewBox="0 0 24 24" style="display:none"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
    </button>
    <div class="recwrap">
      <button class="rec" id="rec" type="button" aria-label="Record this radio" title="Record this radio (saves an MP3)"><i></i></button>
      <span>Record</span>
    </div>
  </div>

  <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="vol">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9z"/></svg>
    <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
  </div>

  <div class="saved" id="saved" role="status" aria-live="polite">
    <span id="msg"></span>
    <a id="dl" style="display:none">Download</a>
    <button id="shfile" type="button" style="display:none">Share</button>
    <button id="x" class="ghost" type="button" aria-label="Close">&#10005;</button>
  </div>

  <button class="share" id="share" type="button">Share this radio</button>
  <p class="note">Live radio, plays right here in your browser.</p>
</main>

<script>
(function () {
  'use strict';
  var TITLE = 'Jesus is LORD Radio';
  var AUTOPLAY = true;   // tries to start on load; if the browser blocks it, listeners just tap play
  // The FIRST link is your live feed; the others are only backups if it fails.
  var SOURCES = [
    'https://stream.zeno.fm/thdtw5xd9eiuv',
    'https://s3.radio.co/s97f38db97/listen',
    'https://stream.zeno.fm/3gdtad95608uv'
  ];
  var CONNECT_MS = 5000, STALL_MS = 7000, RETRY_MS = 6000, MAX_SEC = 7200;   // recordings stop at 2 hours
  var LAME = [
    'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js'
  ];
  var CHASE_LAG = 3, KEEP = 1;     // if we are more than 3s behind the live edge, jump to 1s behind it
  var RATES = [8000, 11025, 12000, 16000, 22050, 24000, 32000, 44100, 48000];

  var $ = function (id) { return document.getElementById(id); };
  var card = $('card'), label = $('label'), playBtn = $('play'), icoPlay = $('ico-play'), icoPause = $('ico-pause');
  var vol = $('vol'), shareBtn = $('share'), recBtn = $('rec');
  var saved = $('saved'), msg = $('msg'), dl = $('dl'), shBtn = $('shfile');

  var idx = 0, want = false, playing = false, fails = 0, connT = null, stallT = null, liveT = null;
  var rec = null, starting = false, pendingRec = false, objUrl = null, noteT = null;
  var ctx = null, srcNode = null, gainNode = null;
  var noCors = {};                       // streams whose server refuses CORS: they play, but cannot be recorded
  var corsAudio = makeEl(true), plainAudio = null, audio = corsAudio;

  function makeEl(cors) {
    var a = new Audio();
    a.preload = 'none';
    a.setAttribute('playsinline', '');
    if (cors) a.crossOrigin = 'anonymous';
    wire(a);
    return a;
  }
  function useEl(cors) {
    var w = cors ? corsAudio : (plainAudio || (plainAudio = makeEl(false)));
    if (w === audio) return;
    audio.pause(); audio.removeAttribute('src'); audio.load();
    audio = w;
    if (!(audio === corsAudio && gainNode)) audio.volume = vol.value / 100;
  }
  function wire(a) {
    function on(ev, fn) { a.addEventListener(ev, function (e) { if (a === audio) fn(e); }); }
    on('playing', function () {
      playing = true; fails = 0; clearT(); ui('live');
      clearInterval(liveT); liveT = setInterval(chase, 1500); setTimeout(chase, 700);
      if (pendingRec) { pendingRec = false; beginCapture(); }
    });
    on('waiting', armStall);
    on('stalled', armStall);
    on('error', function () {
      if (!want) return;
      if (audio === corsAudio && !noCors[idx]) { noCors[idx] = 1; connect(idx); return; }   // retry without CORS
      next();
    });
    on('ended', function () { if (want) connect(idx); });
  }

  function ui(state) {            // 'idle' | 'busy' | 'live'
    card.classList.toggle('is-live', state === 'live');
    card.classList.toggle('is-busy', state === 'busy');
    var on = state !== 'idle';
    icoPlay.style.display = on ? 'none' : '';
    icoPause.style.display = on ? '' : 'none';
    playBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    playBtn.setAttribute('aria-label', (on ? 'Pause ' : 'Play ') + TITLE);
    if (!rec) label.textContent = state === 'idle' ? 'TAP PLAY TO LISTEN' : 'LIVE';
  }
  function clearT() { clearTimeout(connT); clearTimeout(stallT); }
  // Stay in real time: browsers download the stream's start-up burst and any rebuffer delay and play it all,
  // so we drift behind. This skips ahead to the live edge whenever we are too far behind.
  function chase() {
    try {
      var b = audio.buffered;
      if (!want || audio.paused || !b || !b.length) return;
      var end = b.end(b.length - 1);
      if (end - audio.currentTime > CHASE_LAG) audio.currentTime = end - KEEP;
    } catch (e) {}
  }

  function connect(i) {
    clearT(); idx = i; playing = false; ui('busy');
    useEl(!noCors[i]);
    audio.src = SOURCES[i];
    var p = audio.play();
    if (p && p.catch) p.catch(function (e) {
      if (!want) return;
      var n = e && e.name;
      if (n === 'AbortError') return;
      if (n === 'NotAllowedError') { stop(); return; }   // browser blocked autoplay: wait for a tap
      next();
    });
    connT = setTimeout(function () { if (want && !playing) next(); }, CONNECT_MS);
  }
  function next() {
    if (!want) return;
    clearT();
    if (++fails >= SOURCES.length) { fails = 0; connT = setTimeout(function () { if (want) connect(0); }, RETRY_MS); return; }
    connect((idx + 1) % SOURCES.length);
  }
  function play() { want = true; fails = 0; connect(0); }
  function stop() {
    want = false; playing = false; pendingRec = false; clearT(); clearInterval(liveT);
    stopRecording(true);
    audio.pause(); audio.removeAttribute('src'); audio.load();   // next play always joins the live broadcast
    ui('idle');
  }
  function armStall() {
    clearTimeout(stallT);
    if (!want) return;
    stallT = setTimeout(function () { if (want && audio.readyState < 3) connect(idx); }, STALL_MS);
  }

  playBtn.addEventListener('click', function () { want ? stop() : play(); });
  vol.addEventListener('input', function () {
    var v = vol.value / 100;
    if (gainNode) gainNode.gain.value = v;
    if (audio !== corsAudio || !gainNode) audio.volume = v;
  });

  // ---------- Recording (MP3) ----------
  function ensureGraph() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    try { ctx = new AC({ sampleRate: 44100 }); } catch (_) { ctx = new AC(); }
    srcNode = ctx.createMediaElementSource(corsAudio);
    gainNode = ctx.createGain();
    gainNode.gain.value = vol.value / 100;
    corsAudio.volume = 1;                 // listening volume is applied by the gain node, so recordings stay full level
    srcNode.connect(gainNode);
    gainNode.connect(ctx.destination);
  }
  function resample(f, from, to) {
    if (from === to) return f;
    var n = Math.floor(f.length * to / from), out = new Float32Array(n), r = from / to;
    for (var i = 0; i < n; i++) {
      var p = i * r, a = p | 0, b = Math.min(a + 1, f.length - 1);
      out[i] = f[a] + (f[b] - f[a]) * (p - a);
    }
    return out;
  }
  function toInt16(f) {
    var o = new Int16Array(f.length);
    for (var i = 0; i < f.length; i++) { var s = Math.max(-1, Math.min(1, f[i])); o[i] = s < 0 ? s * 32768 : s * 32767; }
    return o;
  }
  function mp3Sink(rate) {
    var target = RATES.indexOf(rate) >= 0 ? rate : 44100;
    var enc = new lamejs.Mp3Encoder(2, target, 128), parts = [];
    return {
      push: function (l, r) {
        var b = enc.encodeBuffer(toInt16(resample(l, rate, target)), toInt16(resample(r, rate, target)));
        if (b.length) parts.push(new Uint8Array(b));
      },
      finish: function () {
        var b = enc.flush(); if (b.length) parts.push(new Uint8Array(b));
        return new Blob(parts, { type: 'audio/mpeg' });
      }
    };
  }
  function loadLame() {
    if (window.lamejs) return Promise.resolve(true);
    return LAME.reduce(function (p, u) {
      return p.then(function (ok) {
        return ok || new Promise(function (res) {
          var s = document.createElement('script');
          s.src = u; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
          s.onload = function () { res(!!window.lamejs); };
          s.onerror = function () { s.remove(); res(false); };
          document.head.appendChild(s);
        });
      });
    }, Promise.resolve(false));
  }
  function drain(r, budget) {
    var t = performance.now();
    while (r.queue.length && (budget == null || performance.now() - t < budget)) { var c = r.queue.shift(); r.sink.push(c[0], c[1]); }
  }

  function beginCapture() {
    if (rec || starting) return;
    if (audio !== corsAudio || noCors[idx]) { note('Recording is not available for this stream.'); return; }
    starting = true;
    try { ensureGraph(); } catch (e) { starting = false; note('Recording is not supported on this browser.'); return; }
    ctx.resume().then(loadLame).then(function (ok) {
      if (!ok) { note("The MP3 encoder couldn't load. Try again."); return; }
      var rate = ctx.sampleRate;
      var r = { sink: mp3Sink(rate), queue: [], frames: 0, rate: rate, peak: 0 };
      var proc = ctx.createScriptProcessor(4096, 2, 2), mute = ctx.createGain();
      mute.gain.value = 0;
      proc.onaudioprocess = function (ev) {
        if (rec !== r) return;
        var l = ev.inputBuffer.getChannelData(0), rr = ev.inputBuffer.numberOfChannels > 1 ? ev.inputBuffer.getChannelData(1) : l;
        r.queue.push([l.slice(), rr.slice()]); r.frames += l.length;
        if (!r.peak) for (var i = 0; i < l.length; i++) if (l[i]) { r.peak = 1; break; }
        drain(r, 6);
        var sec = r.frames / rate;
        if (sec > 8 && !r.peak) setTimeout(function () { stopRecording(false, 'No audio captured. This stream blocks recording.'); }, 0);
        else if (sec >= MAX_SEC) setTimeout(function () { stopRecording(true, 'Maximum length reached.'); }, 0);
      };
      srcNode.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
      r.proc = proc; r.mute = mute;
      rec = r;
      recBtn.classList.add('on');
      recBtn.setAttribute('aria-label', 'Stop recording');
      hideSaved();
      r.timer = setInterval(tick, 500); tick();
    }).catch(function () { rec = null; note('Recording is not supported on this browser.'); })
      .then(function () { starting = false; });
  }
  function tick() {
    if (!rec) return;
    var s = Math.floor(rec.frames / rec.rate);
    label.textContent = 'REC ' + pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function stopRecording(save, text) {
    if (!rec) return;
    var r = rec; rec = null;
    clearInterval(r.timer);
    try { srcNode.disconnect(r.proc); r.proc.disconnect(); r.mute.disconnect(); r.proc.onaudioprocess = null; } catch (_) {}
    recBtn.classList.remove('on');
    recBtn.setAttribute('aria-label', 'Record this radio');
    ui(playing ? 'live' : (want ? 'busy' : 'idle'));
    if (save === false) { note(text || 'Recording discarded.'); return; }
    try {
      drain(r, null);
      var blob = r.sink.finish(), sec = Math.round(r.frames / r.rate);
      if (sec < 1 || !blob.size) { note('Recording too short.'); return; }
      deliver(blob, sec, text);
    } catch (e) { note("Couldn't save the recording."); }
  }

  // ---------- Saved recording: automatic download + Download / Share buttons ----------
  function showSaved(withButtons) {
    dl.style.display = shBtn.style.display = 'none';
    saved.classList.add('show');
  }
  function hideSaved() { saved.classList.remove('show'); clearTimeout(noteT); }
  function note(text) {
    clearTimeout(noteT);
    msg.textContent = text; dl.style.display = shBtn.style.display = 'none';
    saved.classList.add('show');
    noteT = setTimeout(hideSaved, 5000);
  }
  function deliver(blob, sec, text) {
    clearTimeout(noteT);
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(blob);
    var d = new Date();
    var name = 'Jesus-is-LORD-Radio-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.mp3';
    msg.textContent = (text ? text + ' ' : '') + 'Recording saved (' + Math.floor(sec / 60) + ':' + pad(sec % 60) + ', ' + (blob.size / 1048576).toFixed(1) + ' MB)';
    dl.href = objUrl; dl.download = name; dl.style.display = '';
    var file = null, can = false;
    try { file = new File([blob], name, { type: 'audio/mpeg' }); can = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (_) {}
    shBtn.style.display = can ? '' : 'none';
    shBtn.onclick = function () { navigator.share({ files: [file], title: TITLE + ' recording' }).catch(function () {}); };
    saved.classList.add('show');
    try { dl.click(); } catch (_) {}
  }
  $('x').addEventListener('click', function () { hideSaved(); if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; } });

  recBtn.addEventListener('click', function () {
    if (rec) { stopRecording(true); return; }
    if (pendingRec) { pendingRec = false; return; }
    if (!want) {
      pendingRec = true;
      try { ensureGraph(); ctx.resume(); } catch (_) {}   // inside the tap, which iPhones require
      play();
    } else if (playing) beginCapture();
    else pendingRec = true;
  });

  // ---------- Share the page ----------
  shareBtn.addEventListener('click', function () {
    var url = location.href.split('#')[0];
    if (navigator.share) { navigator.share({ title: TITLE, url: url }).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        shareBtn.textContent = 'Link copied';
        setTimeout(function () { shareBtn.textContent = 'Share this radio'; }, 2000);
      }, function () { window.prompt('Copy this link:', url); });
    } else { window.prompt('Copy this link:', url); }
  });

  try {                         // lock-screen / headphone controls
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: TITLE, artist: 'Live radio' });
      navigator.mediaSession.setActionHandler('play', play);
      navigator.mediaSession.setActionHandler('pause', stop);
    }
  } catch (e) {}
  window.addEventListener('pagehide', function () { if (rec) stopRecording(true); });

  ui('idle');
  if (AUTOPLAY) play();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jesus Is LORD Radio</title>
  <!-- Load lamejs encoder for true browser-side MP3 conversion -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    #jil-pill-player {
      display: inline-flex;
      align-items: center;
      background: #0d1d35;
      border-radius: 9999px;
      padding: 6px 14px 6px 6px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
      gap: 12px;
      max-width: 100%;
      box-sizing: border-box;
    }

    .jil-logo-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #9ca3af;
      background: radial-gradient(circle, #1e3a8a 35%, #d1d5db 36%, #9ca3af 100%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
      transition: transform 0.15s ease;
    }
    .jil-logo-btn:hover { transform: scale(1.04); }
    .jil-logo-btn:active { transform: scale(0.96); }

    .jil-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 29, 53, 0.25);
    }

    .jil-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .jil-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .jil-live-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .jil-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8492a6;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .jil-status-dot.active {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .jil-live-text {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 400;
    }

    .jil-circle-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
    }

    .jil-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }

    .jil-circle-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .jil-rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .jil-circle-btn.recording {
      border-color: #ff5252;
      background: rgba(255, 82, 82, 0.15);
    }

    .jil-circle-btn.recording .jil-rec-dot {
      background: #ff5252;
      box-shadow: 0 0 8px #ff5252;
      animation: jilPulse 1.2s infinite;
    }

    .jil-vol-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .jil-vol-popover {
      position: absolute;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d1d35;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 10px 6px;
      display: none;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .jil-vol-wrapper:hover .jil-vol-popover,
    .jil-vol-popover.open {
      display: flex;
    }

    .jil-vol-slider {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 4px;
      height: 64px;
      accent-color: #ff5252;
      cursor: pointer;
    }

    @keyframes jilPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>

  <div id="jil-pill-player">
    <!-- Left Play/Pause Button (Red Icon) -->
    <button id="jil-play-btn" class="jil-logo-btn" aria-label="Play or Pause" title="Play / Pause">
      <div class="jil-play-overlay">
        <svg id="jil-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="#ff5252">
          <polygon points="6,4 20,12 6,20"></polygon>
        </svg>
      </div>
    </button>

    <!-- Title & Live Status -->
    <div class="jil-info">
      <div class="jil-title">Jesus Is LORD Radio</div>
      <div class="jil-live-row">
        <span id="jil-dot" class="jil-status-dot"></span>
        <span id="jil-live-label" class="jil-live-text">Tap to Listen</span>
      </div>
    </div>

    <!-- Circular Record & Volume Buttons -->
    <div class="jil-circle-controls">
      <button id="jil-rec-btn" class="jil-circle-btn" aria-label="Record Live Audio" title="Record Audio">
        <span class="jil-rec-dot"></span>
      </button>

      <div class="jil-vol-wrapper">
        <button id="jil-vol-btn" class="jil-circle-btn" aria-label="Volume" title="Volume">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <div id="jil-vol-popover" class="jil-vol-popover">
          <input type="range" id="jil-volume" class="jil-vol-slider" min="0" max="1" step="0.01" value="0.85">
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const STREAMS = [
      "https://s3.radio.co/s97f38db97/listen",
      "https://stream.zeno.fm/3gdtad95608uv",
      "https://stream.zeno.fm/thdtw5xd9eiuv"
    ];

    const FAILOVER_MS = 10000;
    let currentIdx = 0;
    let isPlaying = false;
    let failoverTimer = null;

    const audio = new Audio();
    audio.preload = "none";

    const playBtn = document.getElementById("jil-play-btn");
    const playIcon = document.getElementById("jil-play-icon");
    const statusDot = document.getElementById("jil-dot");
    const liveLabel = document.getElementById("jil-live-label");
    const volumeSlider = document.getElementById("jil-volume");
    const volBtn = document.getElementById("jil-vol-btn");
    const volPopover = document.getElementById("jil-vol-popover");
    const recBtn = document.getElementById("jil-rec-btn");

    const PLAY_SVG = '<polygon points="6,4 20,12 6,20"></polygon>';
    const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

    audio.volume = parseFloat(volumeSlider.value);

    function setUI(live, label) {
      if (!isRecording) liveLabel.textContent = label;
      if (live) {
        statusDot.classList.add("active");
        playIcon.innerHTML = PAUSE_SVG;
      } else {
        statusDot.classList.remove("active");
        playIcon.innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG;
      }
    }

    function clearTimers() {
      if (failoverTimer) clearTimeout(failoverTimer);
      failoverTimer = null;
    }

    function scheduleFailover() {
      if (failoverTimer || !isPlaying) return;
      setUI(false, "Switching...");

      failoverTimer = setTimeout(() => {
        clearTimers();
        currentIdx = (currentIdx + 1) % STREAMS.length;
        connectStream(currentIdx);
      }, FAILOVER_MS);
    }

    function connectStream(index) {
      clearTimers();
      setUI(false, "Connecting...");

      audio.src = STREAMS[index];
      audio.load();

      scheduleFailover();

      audio.play().then(() => {
        clearTimers();
        setUI(true, "Live");
      }).catch(() => {
        scheduleFailover();
      });
    }

    audio.addEventListener("playing", () => {
      clearTimers();
      setUI(true, "Live");
    });

    audio.addEventListener("error", () => {
      if (isPlaying) scheduleFailover();
    });

    audio.addEventListener("ended", () => {
      if (isPlaying) {
        clearTimers();
        currentIdx = (currentIdx + 1) % STREAMS.length;
        connectStream(currentIdx);
      }
    });

    function startRadio() {
      isPlaying = true;
      connectStream(currentIdx);
    }

    function stopRadio() {
      isPlaying = false;
      clearTimers();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      setUI(false, "Tap to Listen");
      if (isRecording) stopRecording();
    }

    playBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!isPlaying) startRadio();
      else stopRadio();
    });

    volBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      volPopover.classList.toggle("open");
    });

    document.addEventListener("click", () => {
      volPopover.classList.remove("open");
    });

    volPopover.addEventListener("click", (e) => e.stopPropagation());

    volumeSlider.addEventListener("input", (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    // =========================================================
    // TRUE MP3 RECORDING ENGINE (lamejs)
    // =========================================================
    let isRecording = false;
    let recInterval = null;
    let recSeconds = 0;
    let recAudio = null;
    let audioCtxRec = null;
    let scriptProcessor = null;
    let mp3Encoder = null;
    let mp3DataChunks = [];

    function startRecording() {
      if (!isPlaying) startRadio();

      if (typeof lamejs === 'undefined') {
        alert("MP3 encoder library is still loading. Please try again in a moment.");
        return;
      }

      try {
        recAudio = new Audio();
        recAudio.crossOrigin = "anonymous";
        recAudio.src = STREAMS[currentIdx];
        recAudio.muted = true;

        recAudio.play().then(() => {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtxRec = new AudioContext();
          const sourceNode = audioCtxRec.createMediaElementSource(recAudio);
          
          scriptProcessor = audioCtxRec.createScriptProcessor(4096, 1, 1);
          mp3Encoder = new lamejs.Mp3Encoder(1, audioCtxRec.sampleRate, 128);
          mp3DataChunks = [];

          scriptProcessor.onaudioprocess = (e) => {
            if (!isRecording) return;
            const leftChannel = e.inputBuffer.getChannelData(0);
            const sampleChunk = new Int16Array(leftChannel.length);
            for (let i = 0; i < leftChannel.length; i++) {
              let s = Math.max(-1, Math.min(1, leftChannel[i]));
              sampleChunk[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }

            const mp3buf = mp3Encoder.encodeBuffer(sampleChunk);
            if (mp3buf.length > 0) {
              mp3DataChunks.push(new Int8Array(mp3buf));
            }
          };

          sourceNode.connect(scriptProcessor);
          scriptProcessor.connect(audioCtxRec.destination);
          sourceNode.connect(audioCtxRec.destination);

          isRecording = true;
          recBtn.classList.add("recording");
          recSeconds = 0;
          liveLabel.textContent = "Rec 00:00";

          recInterval = setInterval(() => {
            recSeconds++;
            const m = String(Math.floor(recSeconds / 60)).padStart(2, "0");
            const s = String(recSeconds % 60).padStart(2, "0");
            liveLabel.textContent = `Rec ${m}:${s}`;
          }, 1000);
        }).catch(() => {
          cleanupMp3Recorder();
        });
      } catch (err) {
        cleanupMp3Recorder();
      }
    }

    function cleanupMp3Recorder() {
      isRecording = false;
      clearInterval(recInterval);
      recBtn.classList.remove("recording");
      liveLabel.textContent = isPlaying ? "Live" : "Tap to Listen";
      if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor = null;
      }
      if (audioCtxRec) {
        audioCtxRec.close().catch(() => {});
        audioCtxRec = null;
      }
      if (recAudio) {
        recAudio.pause();
        recAudio.removeAttribute("src");
        recAudio = null;
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      clearInterval(recInterval);
      recBtn.classList.remove("recording");
      liveLabel.textContent = isPlaying ? "Live" : "Tap to Listen";

      try {
        if (mp3Encoder) {
          const mp3buf = mp3Encoder.flush();
          if (mp3buf.length > 0) {
            mp3DataChunks.push(new Int8Array(mp3buf));
          }
        }

        const blob = new Blob(mp3DataChunks, { type: "audio/mp3" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = `Jesus-Is-LORD-Radio-${Date.now()}.mp3`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);

        cleanupMp3Recorder();
      } catch (e) {
        cleanupMp3Recorder();
      }
    }

    recBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!isRecording) startRecording();
      else stopRecording();
    });
  })();
  </script>
</body>
</html>

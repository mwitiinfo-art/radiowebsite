<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jesus Is LORD Radio - Live Stream</title>
  <style>
    /* Centering the player on the page for preview/standalone hosting */
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    /* Pill Player Container */
    #jil-pill-player {
      display: inline-flex;
      align-items: center;
      background: #0d1d35;
      border-radius: 9999px;
      padding: 6px 14px 6px 6px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
      gap: 12px;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* Left Play Badge Button */
    .jil-logo-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #9ca3af;
      background: radial-gradient(circle, #1e3a8a 35%, #d1d5db 36%, #9ca3af 100%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
      transition: transform 0.15s ease;
    }
    .jil-logo-btn:hover { transform: scale(1.04); }
    .jil-logo-btn:active { transform: scale(0.96); }

    .jil-logo-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .jil-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 29, 53, 0.25);
    }

    /* Title & Live Status */
    .jil-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .jil-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .jil-live-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .jil-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8492a6;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .jil-status-dot.active {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .jil-live-text {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 400;
    }

    /* Circle Action Buttons (Record & Volume) */
    .jil-circle-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
    }

    .jil-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }

    .jil-circle-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.45);
    }

    /* Record Dot */
    .jil-rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .jil-circle-btn.recording {
      border-color: #ff5252;
      background: rgba(255, 82, 82, 0.15);
    }

    .jil-circle-btn.recording .jil-rec-dot {
      background: #ff5252;
      box-shadow: 0 0 8px #ff5252;
      animation: jilPulse 1.2s infinite;
    }

    /* Volume Vertical Popover */
    .jil-vol-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .jil-vol-popover {
      position: absolute;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d1d35;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 10px 6px;
      display: none;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .jil-vol-wrapper:hover .jil-vol-popover,
    .jil-vol-popover.open {
      display: flex;
    }

    .jil-vol-slider {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 4px;
      height: 64px;
      accent-color: #ff5252;
      cursor: pointer;
    }

    @keyframes jilPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>

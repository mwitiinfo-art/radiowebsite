<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; media-src https: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Jesus is LORD Radio Player</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent!important;color-scheme:normal}body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
.wrap{position:relative;display:flex;align-items:center;justify-content:center;flex:none;transform-origin:center center}
#jil-pill-player{display:inline-flex;align-items:center;background:#122b52;border-radius:0;padding:5px 9px 5px 5px;color:#fff;border:1px solid rgba(255,255,255,.08);user-select:none;gap:7px;flex:none;box-sizing:border-box}
.jil-logo-btn{position:relative;width:42px;height:42px;border-radius:50%;border:2px solid #ffffff;background:#ffffff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;overflow:hidden;transition:transform .15s}
.jil-logo-btn:hover{transform:scale(1.04)}.jil-logo-btn:active{transform:scale(.96)}
.jil-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent}
.jil-info{display:flex;flex-direction:column;justify-content:center}
.jil-title{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;line-height:1.2}
.jil-live-row{display:flex;align-items:center;gap:5px;margin-top:1px}
.jil-status-dot{width:7px;height:7px;border-radius:50%;background:#8492a6;transition:background .3s,box-shadow .3s}
.jil-status-dot.active{background:#00e676;}
.jil-live-text{font-size:10.5px;color:#cbd5e1}
.jil-circle-controls{display:flex;align-items:center;gap:4px;margin-left:0}
.jil-circle-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background .2s,border-color .2s;font:700 10px/1 inherit;padding:0}
.jil-circle-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.45)}
.jil-circle-btn:disabled{opacity:.4;cursor:not-allowed}
.jil-rec-dot{width:7px;height:7px;border-radius:50%;background:#fff;transition:all .2s}
.jil-circle-btn.recording{border-color:#ff5252;background:rgba(255,82,82,.15)}
.jil-circle-btn.recording .jil-rec-dot{background:#ff5252;animation:jilPulse 1.2s infinite}
.jil-vol-wrapper{position:relative;display:flex;align-items:center}
.jil-vol-popover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:58px;background:#122b52;border:1px solid rgba(255,255,255,.25);border-radius:0;display:none;align-items:center;justify-content:center;z-index:300}
.jil-vol-popover.open{display:flex}
.jil-vol-slider{writing-mode:vertical-lr;direction:rtl;width:4px;height:40px;accent-color:#ff5252;cursor:pointer;margin:0}
#jil-panel{display:none;position:absolute;inset:0;z-index:200;align-items:center;justify-content:center;gap:6px;background:#122b52;border:1px solid rgba(255,255,255,.12);border-radius:0;padding:0 10px;color:#e2e8f0;font-size:11px;line-height:1.15;text-align:center}
#jil-panel.show{display:flex}
#jil-panel a,#jil-panel button{background:#3b6fd4;color:#fff;border:0;border-radius:9999px;padding:5px 8px;font:600 10px inherit;cursor:pointer;text-decoration:none}
#jil-panel button.ghost{background:transparent;border:1px solid rgba(255,255,255,.25)}
#jil-wave{width:46px;height:12px;flex-shrink:0;margin-left:1px}.jil-live-text{white-space:nowrap}
@keyframes jilPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="jil-pill-player">
    <button id="jil-play-btn" class="jil-logo-btn" aria-label="Play or Pause" title="Play / Pause">
      <div class="jil-play-overlay">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#e53935"><g id="jil-play-icon"><polygon points="6,4 20,12 6,20"></polygon></g></svg>
      </div>
    </button>
    <div class="jil-info">
      <div class="jil-title">Jesus is LORD Radio</div>
      <div class="jil-live-row"><span id="jil-dot" class="jil-status-dot"></span><span id="jil-live-label" class="jil-live-text">Tap to Listen</span><canvas id="jil-wave" width="70" height="16" aria-hidden="true" style="display:none"></canvas></div>
    </div>
    <div class="jil-circle-controls">
      <button id="jil-rec-btn" class="jil-circle-btn" aria-label="Record live audio" title="Record audio"><span class="jil-rec-dot"></span></button>
      <div class="jil-vol-wrapper">
        <button id="jil-vol-btn" class="jil-circle-btn" aria-label="Volume" title="Volume">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
        <div id="jil-vol-popover" class="jil-vol-popover"><input type="range" id="jil-volume" class="jil-vol-slider" min="0" max="1" step="0.01" value="0.85" aria-label="Volume"></div>
      </div>
    </div>
  </div>
  <div id="jil-panel" role="status" aria-live="polite">
    <span id="jil-msg"></span>
    <a id="jil-dl" style="display:none">Download</a>
    <button id="jil-share" style="display:none">Share</button>
    <button id="jil-x" class="ghost" aria-label="Close">&#10005;</button>
  </div>
</div>

<script>
(() => {
  const STREAMS = [
    "https://stream.zeno.fm/thdtw5xd9eiuv",
    "https://s3.radio.co/s97f38db97/listen",
    "https://stream.zeno.fm/3gdtad95608uv"
  ];
  // Pinned encoder builds, loaded only when first needed (tries the 2nd host if the 1st fails)
  const LAME_URLS = [
    "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"
  ];
  const FAILOVER_MS = 10000;
  const AUTOPLAY = true;     // try to start on page load (browsers often block it; listeners then just tap play)
  const MAX_SEC = 7200;      // 2-hour memory safety cap
  const MP3_RATES = [8000, 11025, 12000, 16000, 22050, 24000, 32000, 44100, 48000];

  let idx = 0, isPlaying = false, isFlowing = false, failTimer = null, watchdog = null, lastTime = -1;
  let rec = null, starting = false, pendingRec = false, objUrl = null, autoTry = false;
  let ctx = null, srcNode = null, gainNode = null, an = null, abuf = null;
  const noCors = new Set(); // streams that only play without CORS (cannot be recorded)

  const $ = id => document.getElementById(id);
  const playBtn = $("jil-play-btn"), playIcon = $("jil-play-icon"), dot = $("jil-dot"), label = $("jil-live-label");
  const vol = $("jil-volume"), volBtn = $("jil-vol-btn"), volPop = $("jil-vol-popover");
  const recBtn = $("jil-rec-btn");
  const panel = $("jil-panel"), msg = $("jil-msg"), dl = $("jil-dl"), shareBtn = $("jil-share");

  let audio = new Audio(), corsAudio = audio, plainAudio = null;
  audio.preload = "none"; audio.crossOrigin = "anonymous";
  audio.setAttribute("playsinline", "");
  audio.volume = parseFloat(vol.value);

  const PLAY = '<polygon points="6,4 20,12 6,20"></polygon>';
  const PAUSE = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

  // ---------- Live audio graph: vertical bars (react to the real audio once the audio graph exists, otherwise gentle motion) ----------
  const cv = $("jil-wave"), cx = cv.getContext("2d"), W = 70, H = 16, N = 14, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lv = new Array(N).fill(0.1);
  let raf = 0, ph = 0, zeroT = 0;
  cv.width = W * dpr; cv.height = H * dpr; cx.scale(dpr, dpr);
  function draw() {
    raf = requestAnimationFrame(draw);
    const live = an && audio === corsAudio;
  if (live) {
    an.getByteFrequencyData(abuf);
    let sum = 0; for (let i = 0; i < abuf.length; i++) sum += abuf[i];
    if (sum) zeroT = 0;
    else if (!zeroT) zeroT = performance.now();
    else if (!rec && performance.now() - zeroT > 12000) { zeroT = 0; noCors.add(idx); connect(idx); }   // silent graph: fall back to plain playback
  }
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = rec ? "#ff5252" : "#00e676";
    const bw = 3, gap = (W - N * bw) / (N - 1);
    for (let i = 0; i < N; i++) {
      const t = live ? Math.min(1, abuf[1 + Math.round(Math.pow(i / (N - 1), 1.6) * 60)] / 255 * 1.3)
                   : 0.3 + 0.5 * Math.abs(Math.sin(ph * (0.5 + i * 0.13) + i * 1.7));
      lv[i] += (t - lv[i]) * 0.35;
      const h = Math.max(2, lv[i] * H);
      cx.fillRect(i * (bw + gap), H - h, bw, h);
    }
    if (!still) ph += 0.12;
  }
  function waves(on) {
    cv.style.display = on ? "block" : "none"; zeroT = 0;
    if (on && !raf) draw(); else if (!on && raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  
  function setUI(live, text) {
    if (!rec) label.textContent = text;
    dot.classList.toggle("active", live); waves(live);
    playIcon.innerHTML = (live || isPlaying) ? PAUSE : PLAY;
  }
  let noteT;
  function note(text) { clearTimeout(noteT); noteT = setTimeout(() => panel.classList.remove("show"), 4500); msg.textContent = text; dl.style.display = shareBtn.style.display = "none"; panel.classList.add("show"); }
  function clearTimers() { if (failTimer) clearTimeout(failTimer); failTimer = null; }

  // ---------- Playback with failover ----------
  function scheduleFailover() {
    if (failTimer || !isPlaying) return;
    isFlowing = false; setUI(false, "Reconnecting...");
    failTimer = setTimeout(() => { clearTimers(); idx = (idx + 1) % STREAMS.length; connect(idx); }, FAILOVER_MS);
  }
  function connect(i) {
    clearTimers(); isFlowing = false; lastTime = -1;
    setUI(false, "Connecting...");
    // CORS mode is required to record; fall back to plain playback if a server refuses it
    useEl(!noCors.has(i));
    audio.src = STREAMS[i];
    audio.load();
    scheduleFailover();
    const p = audio.play();
    if (p && p.catch) p.catch(e => { if (autoTry && e && e.name === "NotAllowedError") stopRadio(); });
  }
  function onFlow() { if (autoTry) { autoTry = false; if (ctx && ctx.state !== "running") { stopRadio(); return; } }
    if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    isFlowing = true; lastTime = audio.currentTime; clearTimers(); setUI(true, "LIVE");
    if (pendingRec) { pendingRec = false; beginCapture(); }
  }
  function makeEl(cors) {
  const a = new Audio(); a.preload = "none"; a.setAttribute("playsinline", "");
  if (cors) a.crossOrigin = "anonymous";
  wire(a); return a;
}
function useEl(cors) {   // CORS element feeds the analyser/recorder; plain element is a playback-only fallback
  const want = cors ? corsAudio : (plainAudio || (plainAudio = makeEl(false)));
  if (want === audio) return;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  audio = want;
  if (!(audio === corsAudio && gainNode)) audio.volume = parseFloat(vol.value);
}
function wire(a) {
const on = (ev, fn) => a.addEventListener(ev, e => { if (a === audio) fn(e); });
on("playing", onFlow);
  on("waiting", () => { if (isPlaying && isFlowing) scheduleFailover(); });
  on("stalled", () => { if (isPlaying && isFlowing) scheduleFailover(); });
  on("error", () => {
    if (!isPlaying) return;
    if (!noCors.has(idx) && audio === corsAudio) { noCors.add(idx); connect(idx); return; } // retry w/o CORS
    scheduleFailover();
  });
  on("ended", () => { if (isPlaying) { clearTimers(); idx = (idx + 1) % STREAMS.length; connect(idx); } });
}
wire(corsAudio);

  function startWatchdog() {
    clearInterval(watchdog);
    watchdog = setInterval(() => {
      if (!isPlaying || !isFlowing) return;
      if (audio.currentTime === lastTime && !failTimer) scheduleFailover();
      else if (audio.currentTime !== lastTime) { lastTime = audio.currentTime; if (failTimer) { clearTimers(); setUI(true, "LIVE"); } }
    }, 2500);
  }
  function startRadio() { isPlaying = true; try { ensureGraph(); ctx.resume(); } catch (_) {} startWatchdog(); connect(idx); }
  function stopRadio() {
    autoTry = false; pendingRec = false;
    stopRecording(true);
    isPlaying = false; isFlowing = false; clearTimers(); clearInterval(watchdog);
    audio.pause(); audio.removeAttribute("src"); audio.load();
    setUI(false, "Tap to Listen");
  }

  playBtn.addEventListener("click", e => { e.stopPropagation(); isPlaying ? stopRadio() : startRadio(); });
  let volT;
  const volLater = () => { clearTimeout(volT); volT = setTimeout(() => volPop.classList.remove("open"), 3000); };
  volBtn.addEventListener("click", e => { e.stopPropagation(); volPop.classList.toggle("open"); volLater(); });
  document.addEventListener("click", () => volPop.classList.remove("open"));
  volPop.addEventListener("click", e => e.stopPropagation());
  vol.addEventListener("input", e => {
    const v = parseFloat(e.target.value); volLater();
    if (gainNode) gainNode.gain.value = v; if (audio !== corsAudio || !gainNode) audio.volume = v;
  });

  // ---------- Audio graph (created once, only when recording is first used) ----------
  function ensureGraph() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    try { ctx = new AC({ sampleRate: 44100 }); } catch (_) { ctx = new AC(); }
    srcNode = ctx.createMediaElementSource(corsAudio);
    gainNode = ctx.createGain();
    gainNode.gain.value = parseFloat(vol.value);
    corsAudio.volume = 1;                       // listening volume is applied by the gain node,
    srcNode.connect(gainNode); an = ctx.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.55; an.minDecibels = -85; an.maxDecibels = -20; abuf = new Uint8Array(an.fftSize); srcNode.connect(an);              // so recordings are always full level
    gainNode.connect(ctx.destination);
  }

  // ---------- Encoders ----------
  function resample(f, from, to) {
    if (from === to) return f;
    const n = Math.floor(f.length * to / from), out = new Float32Array(n), r = from / to;
    for (let i = 0; i < n; i++) {
      const p = i * r, a = p | 0, b = Math.min(a + 1, f.length - 1);
      out[i] = f[a] + (f[b] - f[a]) * (p - a);
    }
    return out;
  }
  function toInt16(f) {
    const o = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) { const s = Math.max(-1, Math.min(1, f[i])); o[i] = s < 0 ? s * 32768 : s * 32767; }
    return o;
  }
  function mp3Sink(rate) {
    const target = MP3_RATES.includes(rate) ? rate : 44100;
    const enc = new lamejs.Mp3Encoder(2, target, 128), parts = [];
    return {
      ext: "mp3",
      push(l, r) {
        const b = enc.encodeBuffer(toInt16(resample(l, rate, target)), toInt16(resample(r, rate, target)));
        if (b.length) parts.push(new Uint8Array(b));
      },
      finish() { const b = enc.flush(); if (b.length) parts.push(new Uint8Array(b)); return new Blob(parts, { type: "audio/mpeg" }); }
    };
  }
  function loadLame() {
    if (window.lamejs) return Promise.resolve(true);
    return LAME_URLS.reduce((p, u) => p.then(ok => ok || new Promise(res => {
      const s = document.createElement("script");
      s.src = u; s.crossOrigin = "anonymous"; s.referrerPolicy = "no-referrer";
      s.onload = () => res(!!window.lamejs); s.onerror = () => { s.remove(); res(false); };
      document.head.appendChild(s);
    })), Promise.resolve(false));
  }

  // ---------- Recording ----------
  async function beginCapture() {
    if (rec || starting) return;
    if (noCors.has(idx) || audio !== corsAudio) { note("Recording not available for this stream."); return; }
    starting = true;
    try {
      ensureGraph();
      await ctx.resume();            // inside the tap's gesture window (needed on iOS)
      if (!(await loadLame())) { note("MP3 encoder couldn't load. Try again."); return; }
      const rate = ctx.sampleRate;
      const r = { sink: mp3Sink(rate), queue: [], frames: 0, rate, peak: 0, cap: MAX_SEC };
      const proc = ctx.createScriptProcessor(4096, 2, 2), mute = ctx.createGain();
      mute.gain.value = 0;
      proc.onaudioprocess = ev => {
        if (rec !== r) return;
        const l = ev.inputBuffer.getChannelData(0), rr = ev.inputBuffer.numberOfChannels > 1 ? ev.inputBuffer.getChannelData(1) : l;
        r.queue.push([l.slice(), rr.slice()]); r.frames += l.length;
        if (!r.peak) for (let i = 0; i < l.length; i++) if (l[i]) { r.peak = 1; break; }
        drain(r, 6);
        const sec = r.frames / rate;
        if (sec > 8 && !r.peak) { setTimeout(() => stopRecording(false, "No audio captured. Stream blocks recording."), 0); }
        else if (sec >= r.cap) setTimeout(() => stopRecording(true, "Max length reached."), 0);
      };
      srcNode.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
      Object.assign(r, { proc, mute });
      rec = r;
      recBtn.classList.add("recording");
      closePanel();
      r.timer = setInterval(() => {
        const s = Math.floor(r.frames / rate);
        label.textContent = "Rec " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }, 500);
      label.textContent = "Rec 00:00";
    } catch (err) {
      rec = null; note("Recording not supported here.");
    } finally { starting = false; }
  }
  function drain(r, budgetMs) {
    const t = performance.now();
    while (r.queue.length && (budgetMs == null || performance.now() - t < budgetMs)) { const [l, rr] = r.queue.shift(); r.sink.push(l, rr); }
  }
  function stopRecording(save = true, text) {
    if (!rec) return;
    const r = rec; rec = null;
    clearInterval(r.timer);
    try { srcNode.disconnect(r.proc); r.proc.disconnect(); r.mute.disconnect(); r.proc.onaudioprocess = null; } catch (_) {}
    recBtn.classList.remove("recording");
    label.textContent = isPlaying ? (isFlowing ? "LIVE" : "Connecting...") : "Tap to Listen";
    if (!save) { note(text || "Recording discarded."); return; }
    try {
      drain(r, null);
      const blob = r.sink.finish();
      if (r.frames / r.rate < 1 || !blob.size) { note("Recording too short."); return; }
      deliver(blob, r.sink.ext, Math.round(r.frames / r.rate), text);
    } catch (e) { note("Couldn't save recording."); }
  }

  // ---------- Delivery: auto-download + fallback Download/Share buttons ----------
  function deliver(blob, ext, sec, text) {
    clearTimeout(noteT);
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(blob);
    const d = new Date(), p = n => String(n).padStart(2, "0");
    const name = `Jesus-is-LORD-Radio-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
    const mb = (blob.size / 1048576).toFixed(1);
    msg.textContent = (text ? text + " " : "") + `Saved ${Math.floor(sec / 60)}:${p(sec % 60)}`;
    dl.href = objUrl; dl.download = name; dl.style.display = "";
    const file = new File([blob], name, { type: blob.type });
    const canShare = navigator.canShare && navigator.canShare({ files: [file] });
    shareBtn.style.display = canShare ? "" : "none";
    shareBtn.onclick = () => navigator.share({ files: [file], title: "Jesus is LORD Radio recording" }).catch(() => {});
    panel.classList.add("show");
    try { dl.click(); } catch (_) {}
  }
  function closePanel() {
    panel.classList.remove("show");
    if (objUrl && !rec) { /* keep URL alive until replaced so the link keeps working */ }
  }
  $("jil-x").addEventListener("click", () => { panel.classList.remove("show"); if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; } });

  recBtn.addEventListener("click", e => {
    e.stopPropagation();
    if (rec) stopRecording(true);
    else if (pendingRec) { pendingRec = false; label.textContent = isPlaying ? "LIVE" : "Tap to Listen"; }
    else if (!isPlaying) { pendingRec = true; label.textContent = "Starting..."; if (!ctx) { try { ensureGraph(); ctx.resume(); } catch (_) {} } startRadio(); }
    else beginCapture();
  });
  // Scale the whole player to fit whatever size the iframe is
  const wrap = document.querySelector(".wrap");
  function fit() {
    wrap.style.transform = "none";
    const s = Math.min(innerWidth / wrap.offsetWidth, innerHeight / wrap.offsetHeight) * 0.98;
    wrap.style.transform = s < 1 ? `scale(${s})` : "none";
  }
  window.addEventListener("resize", fit); window.addEventListener("load", fit); fit();
  if (AUTOPLAY) window.addEventListener("load", () => { autoTry = true; try { startRadio(); } catch (_) { autoTry = false; } });
  window.addEventListener("pagehide", () => { if (rec) stopRecording(true); });
})();
</script>
</body>
</html>
